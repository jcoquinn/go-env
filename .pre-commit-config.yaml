---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: goimports
        name: goimports
        entry: go tool goimports -w
        types: [go]
        language: system
        pass_filenames: true
      - id: golines
        name: golines
        entry: go tool golines -w
        types: [go]
        language: system
        pass_filenames: true
      - id: gofumpt
        name: gofumpt
        entry: go tool gofumpt -w
        types: [go]
        language: system
        pass_filenames: true
      - id: staticcheck
        name: staticcheck
        entry: go tool staticcheck ./...
        types: [go]
        language: system
        pass_filenames: false
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        types: [markdown]
